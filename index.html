<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>韓國旅遊速成教材</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#152036; --muted:#5a6780; --line:#d5dbe6;
  --sign:#0d3b8c; --soft:#e6ebf4;
  --l1:#0052a4; --l2:#007a37; --l3:#b85400; --l4:#007aa6; --l5:#8a5aa0; --l6:#d4145f; --l7:#667000;
  --on-c:#ffffff; --heard:#007a37;
  --f-body:"Noto Sans TC","Noto Sans KR","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans TC",sans-serif;
  --f-disp:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --tabh:58px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1524; --surface:#172238; --ink:#e8edf6; --muted:#9aa8c2; --line:#2a3856; --sign:#1a4fb8; --soft:#1f2c47;
    --l1:#3f86d8; --l2:#2fb36a; --l3:#f08a3c; --l4:#35b4e2; --l5:#b489c9; --l6:#ee4a86; --l7:#a3b12a; --on-c:#0e1524; --heard:#2fb36a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1524; --surface:#172238; --ink:#e8edf6; --muted:#9aa8c2; --line:#2a3856; --sign:#1a4fb8; --soft:#1f2c47;
  --l1:#3f86d8; --l2:#2fb36a; --l3:#f08a3c; --l4:#35b4e2; --l5:#b489c9; --l6:#ee4a86; --l7:#a3b12a; --on-c:#0e1524; --heard:#2fb36a;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--l4);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:50px;padding:0 12px}
.top h1{margin:0;font-size:18px;line-height:1.3;flex:1;text-wrap:balance}
.back{border:0;background:none;padding:6px 8px 6px 2px;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.speed{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}

.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 32px)}
h2{font-size:17px;margin:26px 0 10px;text-wrap:balance}
h2:first-child{margin-top:4px}
.lead{color:var(--muted);margin:0 0 12px;max-width:38em}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.stack{display:grid;gap:8px}

/* home nameplate */
.sign{background:var(--sign);color:#fff;border-radius:10px;padding:14px 14px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.sign .nb{font-size:12px;line-height:1.35;opacity:.9}
.sign .nb.r{text-align:right}
.sign .mid{text-align:center}
.sign .k{font:400 30px/1.1 var(--f-disp)}
.sign .t{margin-top:4px;font-size:15px;font-weight:700;letter-spacing:.04em}
.track{height:6px;margin:0 10px 16px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--l1) 0 17%,var(--l2) 17% 34%,var(--l3) 34% 50%,var(--l4) 50% 67%,var(--l5) 67% 84%,var(--l6) 84% 100%)}

/* search */
.search{position:relative;margin:0 0 4px}
.search input{width:100%;font:inherit;font-size:16px;padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}

/* phrase rows */
.ph{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.ph:hover{border-color:var(--c,var(--l1))}
.ph .dt{grid-row:1 / span 3;margin-top:10px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line)}
.ph .dt.on{background:var(--heard);border-color:var(--heard)}
.ph .ko{font:700 19px/1.4 var(--f-ko)}
.ph .zh{font-weight:500;font-size:15px}
.ph .rm{font-size:13px;color:var(--muted)}

/* chips */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;line-height:1.3}
.chip:hover{border-color:var(--c,var(--l1))}
.chip .ko{display:block;font:700 18px/1.3 var(--f-ko)}
.chip .rm{display:block;font-size:12px;color:var(--muted)}
.chip .zh{display:block;font-size:14px;font-weight:500}

/* scene tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;padding:10px 12px 12px}
.tile:hover{border-color:var(--c)}
.tile b{font-size:17px}
.tile .ko{font:400 14px/1.3 var(--f-ko);color:var(--muted)}
.tile .cnt{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.wide-link{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.wide-link .g{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--c,var(--l7));color:var(--on-c);font:400 24px/1 var(--f-disp)}
.wide-link b{display:block}
.wide-link span span{font-size:14px;color:var(--muted)}
.wide-link::after{content:"›";margin-left:auto;font-size:22px;color:var(--muted)}

/* hangul cards */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.hc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;line-height:1.3}
.hc:hover{border-color:var(--l7)}
.hc b{display:block;font:400 34px/1.15 var(--f-disp)}
.hc .s{display:block;font:700 15px/1.3 var(--f-ko)}
.hc .r{display:block;font-size:12px;color:var(--muted)}
.hc small{display:block;font-size:12px;margin-top:2px}
.hc .ex{display:block;font-size:12px;color:var(--muted);margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
.hc .exk{font:700 13px/1.3 var(--f-ko);color:var(--ink)}

.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border-radius:10px;overflow:hidden}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--soft)}
.scroll{overflow-x:auto}
ul.plain{margin:0 0 12px;padding-left:1.2em}
ul.plain li{margin:0 0 4px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.chk input{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--l7)}
.foot{margin-top:32px;font-size:13px;color:var(--muted)}

/* practice */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px;text-align:center}
.quiz .q{font-size:22px;font-weight:700;margin:6px 0 4px;text-wrap:balance}
.quiz .hint{font-size:13px;color:var(--muted)}
.quiz .a{margin:14px 0 0;padding-top:14px;border-top:1px dashed var(--line)}
.quiz .a .ko{font:700 24px/1.4 var(--f-ko)}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:500;cursor:pointer}
.btn.pri{background:var(--l1);border-color:var(--l1);color:var(--on-c)}
.pr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pr .pt{margin:0 0 4px;font-weight:700}
.pr .tx{margin:0 0 8px;font-size:15px}
.cp{border:1px solid var(--l6);background:transparent;color:var(--l6);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:500;cursor:pointer}

/* empty state */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px 16px;text-align:center}
.empty p{margin:0 0 12px;color:var(--muted)}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:12px;color:var(--muted)}
.tabbar a[aria-current="page"]{color:var(--l1);font-weight:700}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar .gl{font:400 20px/22px var(--f-disp)}

/* phrase sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,16,30,.45)}
.panel{width:100%;max-width:560px;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto}
.panel .ko{font:700 28px/1.35 var(--f-ko);margin:0}
.panel .zh{font-size:18px;font-weight:500;margin:2px 0 6px}
.panel .rm{font-size:14px;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 4px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-size:13px;font-weight:500;cursor:pointer}
.act svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act[aria-pressed="true"]{border-color:var(--l6);color:var(--l6)}
.act[aria-pressed="true"] svg{fill:currentColor}
.spell{margin-top:12px;font-size:14px}
.spell summary{cursor:pointer;color:var(--muted)}
.spell .sy{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.spell .sy span{background:var(--soft);border-radius:8px;padding:4px 10px;font-family:var(--f-ko)}
.close{display:block;margin:14px auto 0;border:0;background:none;color:var(--muted);cursor:pointer;padding:6px 12px}

/* show-to-staff */
.show{position:fixed;inset:0;z-index:50;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;cursor:pointer}
.show .ko{font:700 clamp(40px,13vw,96px)/1.25 var(--f-ko);text-wrap:balance;word-break:keep-all}
.show .zh{font-size:18px;color:var(--muted)}
.show .x{font-size:13px;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#toast.show{opacity:1}
@media (max-width:420px){.sign .k{font-size:26px}.acts{gap:6px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

<header class="top">
  <div class="top-in">
    <button class="back" id="back" type="button" aria-label="返回" hidden>‹</button>
    <h1 id="ttl">旅遊韓語</h1>
    <button class="speed" id="speed" type="button" aria-pressed="false">語速：正常</button>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabbar" aria-label="主要分頁">
  <div class="tabbar-in">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>情境</a>
    <a href="#/practice" data-tab="practice"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>練習</a>
    <a href="#/tools" data-tab="tools"><span class="gl" aria-hidden="true">가</span>工具</a>
    <a href="#/list" data-tab="list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>清單</a>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sk" tabindex="-1" id="panel">
    <p class="ko" id="sk"></p>
    <p class="zh" id="sz"></p>
    <div class="rm" id="sr"></div>
    <div class="acts">
      <button class="act" type="button" data-act="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>播放</button>
      <button class="act" type="button" data-act="slow"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>慢速</button>
      <button class="act" type="button" data-act="star" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>收藏</button>
      <button class="act" type="button" data-act="show"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>出示</button>
    </div>
    <details class="spell" id="spell"><summary>看拼法</summary><div class="sy" id="sy"></div></details>
    <button class="close" type="button" data-act="close">關閉</button>
  </div>
</div>

<div class="show" id="show" role="dialog" aria-modal="true" aria-label="出示給對方看" tabindex="-1" hidden>
  <div class="ko" id="showk"></div>
  <div class="zh" id="showz"></div>
  <div class="x">點一下關閉</div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

  function spell(word){
    var out=[],seen={};
    for(var i=0;i<word.length;i++){
      var c=word.charCodeAt(i)-0xAC00;

      seen[word[i]]=1;
      var parts=[JL[Math.floor(c/588)],JV[Math.floor(c%588/28)]];
      if(c%28)parts.push(JT[c%28]);
      out.push(word[i]+' = '+parts.join('+'));
    }

  }

          :'<h2>常用句都聽過了</h2><p class="lead">到「練習」遮住韓文考考自己，或到「清單」收藏你最常用的句子。</p>')+
        '<h2>選一個情境</h2><div class="tiles">'+SC.map(function(s){
          return '<a class="tile" href="#/scene/'+s.id+'" style="--c:'+s.c+'"><b>'+s.n+'</b><span class="ko">'+s.ko+'</span><span class="cnt">聽過 '+heardIn(s.keys)+' / '+s.keys.length+'</span></a>';
        }).join('')+'</div>'+
        '<h2>想看懂招牌？</h2><a class="wide-link" href="#/tools/hangul"><span class="g" aria-hidden="true">한</span><span><b>認字入門</b><span>24 個字母，每個搭一個例字</span></span></a>'+
      '</div>'};
  };
  V.scene=function(id){
    var s=SC.filter(function(x){return x.id===id;})[0];
    if(!s)return V.home();
    var h='<p class="note">'+s.tip+'</p><div class="stack" style="--c:'+s.c+'">'+s.keys.map(row).join('')+'</div>';
    (EXTRA[id]||[]).forEach(function(b){
      h+='<h2>'+b.h+'</h2>'+(b.chips?chips(b.chips):rows(b.rows))+(b.note?'<p class="note" style="margin-top:10px">'+b.note+'</p>':'');
    });
    return {t:s.n,back:'#/',html:'<div style="--c:'+s.c+'">'+h+'</div>'};
  };
  V.practice=function(){
    return {t:'練習',html:
      '<h2>遮住韓文，考考自己</h2><p class="lead">看中文，先試著說出韓文，再翻開對答案。題目從你聽過的句子裡出。</p><div id="quiz"></div>'+
      '<h2>用 Claude 語音對話</h2><p class="note">在 Claude App 打開「設定 &gt; 一般 &gt; 語音 &gt; 語言」，手動選「한국어」。先用文字貼上提示詞，再點輸入框旁的音波圖示切換成語音。</p>'+
      '<div class="stack">'+PROMPTS.map(function(p,i){
        return '<div class="pr"><p class="pt">'+p[0]+'</p><p class="tx">'+p[1]+'</p><button class="cp" type="button" data-copy="'+i+'">複製提示詞</button></div>';
      }).join('')+'</div>'};
  };
  V.tools=function(){
    return {t:'工具',html:'<div class="stack">'+
      '<a class="wide-link" href="#/tools/hangul"><span class="g" aria-hidden="true">한</span><span><b>認字入門</b><span>字母、拼字、尾音、招牌</span></span></a>'+
      '<a class="wide-link" href="#/tools/numbers" style="--c:var(--l4)"><span class="g" aria-hidden="true">₩</span><span><b>數字與價錢</b><span>兩套數字、量詞、聽懂價錢</span></span></a>'+
      '<a class="wide-link" href="#/tools/prep" style="--c:var(--l3)"><span class="g" aria-hidden="true">✓</span><span><b>出發前準備</b><span>App、交通卡、網路、文化提醒</span></span></a>'+
      '</div><p class="foot">近似音與語音都只是輔助，發音以真人為準。播放沒有聲音時，請確認手機沒有開靜音。</p>'};
  };
  V.hangul=function(){
    return {t:'認字入門',back:'#/tools',html:
      '<p class="lead">韓文只有 24 個基本字母。點卡片會先唸音節，再唸一個以它開頭的例字。</p>'+
      '<p class="note">「≈」後面是用中文寫的近似音，只能幫你起步，實際發音以語音為準。</p>'+
      '<h2>母音（10 個）</h2><div class="hgrid">'+VOW.map(hc).join('')+'</div>'+
      '<h2>子音（14 個）</h2><div class="hgrid">'+CON.map(hc).join('')+'</div>'+
      '<h2>字母怎麼組成字</h2><ul class="plain">'+
        '<li>韓文像拼積木：子音 + 母音，有時再加一個尾音。<b>한</b> = ㅎ + ㅏ + ㄴ。</li>'+
        '<li>母音在右邊（ㅏ ㅣ）就左右排，在下面（ㅗ ㅜ ㅡ）就上下排。</li>'+
        '<li>ㅇ 放在開頭時不發音，只是佔位，所以 아 就是單純的「阿」。</li>'+
        '<li>ㄲ ㄸ ㅃ ㅆ ㅉ 是加重的音，旅遊階段先當成一般的 ㄱ ㄷ ㅂ ㅅ ㅈ 也能被聽懂。</li>'+
        '<li>任何句子打開後按「看拼法」，都能看到每個字是怎麼拼的。</li></ul>'+
      '<h2>尾音只有 7 種發音</h2><div class="scroll"><table class="tbl">'+
        '<tr><th>尾音字母</th><th>唸成</th><th>例子</th></tr>'+
        '<tr><td>ㄱ ㄲ ㅋ</td><td>k</td><td>학교、부엌</td></tr><tr><td>ㄴ</td><td>n</td><td>안녕</td></tr>'+
        '<tr><td>ㄷ ㅅ ㅈ ㅊ ㅌ ㅎ</td><td>t</td><td>옷、꽃</td></tr><tr><td>ㄹ</td><td>l</td><td>물</td></tr>'+
        '<tr><td>ㅁ</td><td>m</td><td>감사</td></tr><tr><td>ㅂ ㅍ</td><td>p</td><td>밥、앞</td></tr><tr><td>ㅇ</td><td>ng</td><td>공항</td></tr></table></div>'+
      '<p class="note" style="margin-top:10px"><b>台灣人的優勢：</b>如果你會閩南語或客語，k、t、p 收尾的音你本來就會（像「六」「食」「十」），n、m、ng 收尾則跟華語的 -n、-ng 很像。</p>'+
      '<h2>練習讀招牌</h2><p class="lead">先試著拼出來，再點卡片核對。</p>'+chips(SIGNS)+
      '<h2>外來語：其實你早就會了</h2><p class="lead">很多韓文是英文的音譯，唸出來你就懂。</p>'+chips(LOANS)};
  };
  V.numbers=function(){
    return {t:'數字與價錢',back:'#/tools',html:
      '<p class="note"><b>漢字數字</b>用在價錢、樓層、號碼、日期。<b>固有數字</b>用在數量、人數、幾點。</p>'+
      '<h2>漢字數字（價錢用）</h2>'+chips(SINO)+
      '<h2>聽懂價錢</h2><p class="note">一萬直接說 <b>만</b>，不說 일만。所以 12,000 是 만 이천，50,000 是 오만。</p>'+rows(PRICES)+
      '<h2>固有數字（數東西用）</h2>'+chips(NATIVE)+
      '<p class="note" style="margin-top:10px">後面接量詞時，하나 → <b>한</b>、둘 → <b>두</b>、셋 → <b>세</b>、넷 → <b>네</b>。常用量詞：개（個）、명（人）、잔（杯）、병（瓶）。例外：<b>인분</b>（人份）要配漢字數字，兩人份是 이 인분。</p>'+rows(COUNTERS)};
  };
  V.prep=function(){
    return {t:'出發前準備',back:'#/tools',html:
      '<p class="lead">以下是一般性資訊，出發前請再到官方管道確認。</p>'+
      PRE.map(function(t,i){return '<label class="chk"><input type="checkbox" id="pre'+i+'" data-pre="p'+i+'"'+(state.p['p'+i]?' checked':'')+'><span>'+t+'</span></label>';}).join('')+
      '<h2>小小文化提醒</h2><ul class="plain">'+
        '<li>韓國一般沒有給小費的習慣。</li><li>遞東西或接東西時用雙手，比較有禮貌。</li>'+
        '<li>很多餐廳桌上有呼叫鈴，沒有的話就舉手喊 여기요。</li><li>部分烤肉店是 2 人份起點，一個人吃前先問一下。</li></ul>'};
  };
  V.list=function(){
    var keys=Object.keys(state.s).filter(function(k){return state.s[k]&&PH[k];});
    return {t:'清單',html:keys.length
      ?'<p class="lead">你收藏的句子。旅途中打開這裡最快，點開後可以按「出示」給對方看。</p><div class="stack">'+keys.map(row).join('')+'</div>'
      :'<div class="empty"><p>在句子卡上按「收藏」，常用的句子就會集中在這裡，旅途中一打開就找得到。</p><button class="btn pri" type="button" id="seed">先收藏三句必學</button></div>'};
  };

  /* ---------- router ---------- */
  var ROUTES={'':'home','practice':'practice','tools':'tools','tools/hangul':'hangul','tools/numbers':'numbers','tools/prep':'prep','list':'list'};
  function render(){
    var path=location.hash.replace(/^#\/?/,''),v,tab;
    if(path.indexOf('scene/')===0){v=V.scene(path.slice(6));tab='home';}
    else{var n=ROUTES[path]||'home';v=V[n]();tab=n==='home'?'home':(path.split('/')[0]);}
    $('view').innerHTML=v.html;
    $('ttl').textContent=v.t;
    document.title=v.t==='旅遊韓語'?'韓國旅遊速成教材':v.t+'｜韓國旅遊速成教材';
    $('back').hidden=!v.back;$('back').dataset.to=v.back||'';
    [].forEach.call(document.querySelectorAll('.tabbar a'),function(a){
      if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
    });
    if($('quiz'))nextQuiz();
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',render);

  /* ---------- search ---------- */
  function search(q){
    var box=$('results'),body=$('homebody');
    q=q.trim().toLowerCase().replace(/\s+/g,'');
    if(!q){box.innerHTML='';body.hidden=false;return;}
    var hit=Object.keys(PH).filter(function(k){
      var p=PH[k];return (p.ko+p.zh+p.rm).toLowerCase().replace(/\s+/g,'').indexOf(q)>=0;
    }).slice(0,30);
    body.hidden=true;
    box.innerHTML=hit.length?'<h2>找到 '+hit.length+' 句</h2><div class="stack">'+hit.map(row).join('')+'</div>'
      :'<p class="lead" style="margin-top:14px">找不到符合的句子。試試中文關鍵字，例如「廁所」「刷卡」。</p>';
  }

  /* ---------- phrase sheet ---------- */
  var cur=null,lastFocus=null;
  function markHeard(k){
    state.h[k]=(state.h[k]||0)+1;save();
    [].forEach.call(document.querySelectorAll('[data-open="'+k+'"] .dt'),function(d){d.classList.add('on');});
  }
  function openSheet(k){
    var p=PH[k];if(!p)return;
    cur=k;lastFocus=document.activeElement;
    $('sk').textContent=p.ko;$('sz').textContent=p.zh;
    $('sr').textContent=p.rm+(p.zy?'　≈ '+p.zy:'');
    $('sy').innerHTML=spell(p.ko).map(function(s){return '<span>'+s+'</span>';}).join('');
    $('spell').open=false;
    document.querySelector('[data-act="star"]').setAttribute('aria-pressed',String(!!state.s[k]));
    $('sheet').hidden=false;document.body.classList.add('lock');
    $('panel').focus();
    speak(p.ko,state.slow);markHeard(k);
  }
  function closeSheet(){
    $('sheet').hidden=true;document.body.classList.remove('lock');
    if(lastFocus&&document.contains(lastFocus))lastFocus.focus();
    if(location.hash.replace(/^#\/?/,'')==='list')render();
  }
  var wake=null;
  function showBig(){
    var p=PH[cur];
    $('showk').textContent=p.ko;$('showz').textContent=p.zh;
    $('show').hidden=false;$('show').focus();
    try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(function(w){wake=w;}).catch(function(){});}catch(e){}
  }
  function hideBig(){
    $('show').hidden=true;$('panel').focus();
    try{wake&&wake.release();}catch(e){}wake=null;
  }

  /* ---------- quiz ---------- */
  var qk=null;
  function nextQuiz(){
    var pool=Object.keys(state.h).filter(function(k){return PH[k]&&PH[k].zy;});
    if(pool.length<5)PRIORITY.forEach(function(k){if(pool.indexOf(k)<0)pool.push(k);});
    var bag=[];
    pool.forEach(function(k){if(k===qk&&pool.length>1)return;var w=state.k[k]==='ok'?1:3;for(var i=0;i<w;i++)bag.push(k);});
    qk=bag[Math.floor(Math.random()*bag.length)];
    var p=PH[qk],q=$('quiz');
    q.innerHTML='<div class="quiz"><div class="hint">用韓文怎麼說？</div><div class="q">'+esc(p.zh)+'</div>'+
      '<div class="btns"><button class="btn pri" type="button" data-q="reveal">翻開答案</button></div></div>';
  }
  function revealQuiz(){
    var p=PH[qk];
    document.querySelector('.quiz .btns').outerHTML='<div class="a"><div class="ko">'+esc(p.ko)+'</div><div class="hint">'+esc(p.rm)+'　≈ '+esc(p.zy)+'</div>'+
      '<div class="btns"><button class="btn" type="button" data-q="again">還不熟</button><button class="btn pri" type="button" data-q="ok">說對了</button></div></div>';
    speak(p.ko,state.slow);markHeard(qk);
  }

  /* ---------- events ---------- */
  function syncSpeed(){var b=$('speed');b.textContent='語速：'+(state.slow?'慢':'正常');b.setAttribute('aria-pressed',String(state.slow));}
  syncSpeed();
  document.addEventListener('input',function(e){if(e.target.id==='q')search(e.target.value);});
  document.addEventListener('change',function(e){
    var k=e.target.getAttribute&&e.target.getAttribute('data-pre');
    if(k){state.p[k]=e.target.checked;save();}
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(!$('show').hidden)hideBig();else if(!$('sheet').hidden)closeSheet();
  });
  document.addEventListener('click',function(e){
    if(e.target.closest('#show')){hideBig();return;}
    if(e.target.id==='sheet'){closeSheet();return;}
    var t=e.target.closest('[data-open],[data-say],[data-act],[data-copy],[data-q],#speed,#back,#seed');
    if(!t)return;
    if(t.id==='speed'){state.slow=!state.slow;save();syncSpeed();return;}
    if(t.id==='back'){location.hash=t.dataset.to;return;}
    if(t.id==='seed'){TRIO.forEach(function(a){state.s[norm(a[0])]=1;});save();render();return;}
    if(t.hasAttribute('data-open')){openSheet(t.getAttribute('data-open'));return;}
    if(t.hasAttribute('data-say')){speak(t.getAttribute('data-say'),state.slow);return;}
    if(t.hasAttribute('data-q')){
      var a=t.getAttribute('data-q');
      if(a==='reveal')revealQuiz();else{state.k[qk]=a;save();nextQuiz();}
      return;
    }
    if(t.hasAttribute('data-act')){
      var act=t.getAttribute('data-act');
      if(act==='play')speak(PH[cur].ko,false);
      else if(act==='slow')speak(PH[cur].ko,true);
      else if(act==='star'){if(state.s[cur])delete state.s[cur];else state.s[cur]=1;save();t.setAttribute('aria-pressed',String(!!state.s[cur]));toast(state.s[cur]?'已加入清單':'已從清單移除');}
      else if(act==='show')showBig();
      else if(act==='close')closeSheet();
      return;
    }
    if(t.hasAttribute('data-copy')){
      var txt=PROMPTS[parseInt(t.getAttribute('data-copy'),10)][1];
      var fallback=function(){
        var ok=false;
        try{
          var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
          document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');document.body.removeChild(ta);
        }catch(err){ok=false;}
        toast(ok?'已複製':'複製失敗，請長按文字手動複製');
      };
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast('已複製');},fallback);
      else fallback();
    }
  });

  render();
})();
</script>
</body>
</html>
