<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>韓國旅遊速成教材</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="旅遊韓語">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@500;700;800&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --soft:#f6f7f9; --line:#e7e9ee; --ink:#161b26; --muted:#667085;
  --sun:#ffd21e; --sun-soft:#fff7d6; --sun-line:#f3c300; --sign:#0b5cad;
  --l1:#0369a1; --l2:#15803d; --l3:#c2410c; --l4:#0e7490; --l5:#6d28d9; --l6:#be185d; --l7:#a16207;
  --b1:#e0f2fe; --b2:#dcfce7; --b3:#ffedd5; --b4:#cffafe; --b5:#ede9fe; --b6:#fce7f3; --b7:#fef3c7;
  --on-c:#ffffff; --heard:#16a34a;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
  --f-body:"Nunito","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans TC",sans-serif;
  --f-disp:"Jua","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-glyph:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --tabh:62px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b0f19; --surface:#111827; --soft:#182131; --line:#263041; --ink:#f3f4f6; --muted:#9ca3af;
    --sun:#ffd21e; --sun-soft:#352d0e; --sun-line:#8a6d00; --sign:#1d6fd1;
    --l1:#7dd3fc; --l2:#86efac; --l3:#fdba74; --l4:#67e8f9; --l5:#c4b5fd; --l6:#f9a8d4; --l7:#fcd34d;
    --b1:#0c2a3f; --b2:#0f2e1c; --b3:#3a1f0c; --b4:#0b2e35; --b5:#241a45; --b6:#3a1329; --b7:#3a2d0a;
    --on-c:#0b0f19; --heard:#4ade80; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0f19; --surface:#111827; --soft:#182131; --line:#263041; --ink:#f3f4f6; --muted:#9ca3af;
  --sun:#ffd21e; --sun-soft:#352d0e; --sun-line:#8a6d00; --sign:#1d6fd1;
  --l1:#7dd3fc; --l2:#86efac; --l3:#fdba74; --l4:#67e8f9; --l5:#c4b5fd; --l6:#f9a8d4; --l7:#fcd34d;
  --b1:#0c2a3f; --b2:#0f2e1c; --b3:#3a1f0c; --b4:#0b2e35; --b5:#241a45; --b6:#3a1329; --b7:#3a2d0a;
  --on-c:#0b0f19; --heard:#4ade80; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun-line);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:50px;padding:0 12px}
.top h1{margin:0;font-size:18px;font-weight:800;line-height:1.3;flex:1;text-wrap:balance}
.logo{flex:none;width:30px;height:30px;border-radius:9px;background:var(--sun);color:#161b26;display:grid;place-items:center;font:400 18px/1 var(--f-disp);text-decoration:none}
.back{border:0;background:none;padding:6px 8px 6px 2px;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.speed{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}

.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 32px)}
h2{font-size:18px;font-weight:800;margin:28px 0 12px;text-wrap:balance}
h2:first-child{margin-top:4px}
.lead{color:var(--muted);margin:0 0 12px;max-width:38em}
.note{background:var(--sun-soft);border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 12px}
.stack{display:grid;gap:10px}

/* home hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px 20px;margin:4px 0 18px;
  background:radial-gradient(120% 90% at 100% 0%,var(--b6) 0,transparent 55%),radial-gradient(90% 80% at 0% 100%,var(--b1) 0,transparent 60%),var(--sun-soft);border:1px solid var(--line)}
.hero .pill{display:inline-block;font-size:13px;font-weight:800;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.hero h1{margin:12px 0 4px;font:400 46px/1.1 var(--f-disp);letter-spacing:.01em}
.hero h1 mark{background:linear-gradient(transparent 58%,var(--sun) 58% 92%,transparent 92%);color:inherit;padding:0 2px}
.hero p{margin:0;max-width:24em;color:var(--muted);font-size:15px}
.bubbles{position:absolute;right:14px;top:14px;display:grid;grid-template-columns:repeat(2,auto);gap:6px;pointer-events:none}
.bubbles span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:400 20px/1 var(--f-disp);background:var(--surface);box-shadow:var(--shadow)}
.bubbles span:nth-child(1){color:var(--l1);transform:rotate(-8deg)}
.bubbles span:nth-child(2){color:var(--l6);transform:translateY(14px) rotate(6deg)}
.bubbles span:nth-child(3){color:var(--l2);transform:rotate(5deg)}
.bubbles span:nth-child(4){color:var(--l3);transform:translateY(14px) rotate(-5deg)}
@media (max-width:420px){.hero h1{font-size:38px}.bubbles{right:10px;top:10px}.bubbles span{width:32px;height:32px;font-size:16px}}

/* search */
.search{position:relative;margin:0 0 4px}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 14px 12px 42px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--sun-line);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 35%,transparent)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}

/* phrase rows */
.ph{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s}
.ph:hover{background:var(--soft);box-shadow:var(--shadow);transform:translateY(-1px)}
.ph .dt{grid-row:1 / span 3;margin-top:10px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line)}
.ph .dt.on{background:var(--heard);border-color:var(--heard)}
.ph .ko{font:700 19px/1.4 var(--f-ko)}
.ph .zh{font-weight:500;font-size:15px}
.ph .rm{font-size:13px;color:var(--muted);font-weight:600}

/* chips */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 6px;text-align:center;cursor:pointer;line-height:1.3;transition:transform .12s,box-shadow .12s}
.chip:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.chip .ko{display:block;font:700 18px/1.3 var(--f-ko)}
.chip .rm{display:block;font-size:12px;color:var(--muted)}
.chip .zh{display:block;font-size:14px;font-weight:500}

/* scene tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:2px;text-decoration:none;border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;
  background:linear-gradient(145deg,var(--cb) 0%,var(--surface) 78%);transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .mark{align-self:flex-start;min-width:44px;height:44px;padding:0 8px;border-radius:14px;display:grid;place-items:center;margin-bottom:8px;background:var(--surface);color:var(--c);font:400 24px/1 var(--f-disp);box-shadow:var(--shadow)}
.tile b{font-size:17px;font-weight:800}
.tile .ko{font:400 14px/1.3 var(--f-ko);color:var(--muted)}
.tile .cnt{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.wide-link{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;transition:transform .12s,box-shadow .12s}
.wide-link:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.wide-link .g{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--l7)) 16%,var(--surface));color:var(--c,var(--l7));font:400 24px/1 var(--f-disp)}
.wide-link b{font-weight:800}
.wide-link b{display:block}
.wide-link span span{font-size:14px;color:var(--muted)}
.wide-link::after{content:"›";margin-left:auto;font-size:22px;color:var(--muted)}

/* hangul cards */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.hc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;text-align:center;cursor:pointer;line-height:1.3;transition:transform .12s,box-shadow .12s}
.hc:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.hc b{display:block;font:700 34px/1.15 var(--f-glyph)}
.hc .s{display:block;font:700 15px/1.3 var(--f-ko)}
.hc .r{display:block;font-size:12px;color:var(--muted)}
.hc small{display:block;font-size:12px;margin-top:2px}
.hc .ex{display:block;font-size:12px;color:var(--muted);margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
.hc .exk{font:700 13px/1.3 var(--f-ko);color:var(--ink)}

.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--soft)}
.scroll{overflow-x:auto}
ul.plain{margin:0 0 12px;padding-left:1.2em}
ul.plain li{margin:0 0 4px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.chk input{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--l7)}
.foot{margin-top:32px;font-size:13px;color:var(--muted)}

/* practice */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 16px;text-align:center;box-shadow:var(--shadow)}
.quiz .q{font-size:22px;font-weight:700;margin:6px 0 4px;text-wrap:balance}
.quiz .hint{font-size:13px;color:var(--muted)}
.quiz .a{margin:14px 0 0;padding-top:14px;border-top:1px dashed var(--line)}
.quiz .a .ko{font:700 24px/1.4 var(--f-ko)}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--sun);border-color:var(--sun-line);color:#161b26}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer}
.seg button[aria-checked="true"],.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.scene.no-rm .ph .rm,.scene.no-rm .chip .rm,.scene.no-zh .ph .zh,.scene.no-zh .chip .zh{visibility:hidden}
#aip{width:100%;font:inherit;font-size:14px;line-height:1.55;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);resize:vertical}

/* empty state */
.empty{background:var(--soft);border:1px dashed var(--line);border-radius:18px;padding:20px 16px;text-align:center}
.empty p{margin:0 0 12px;color:var(--muted)}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:12px;font-weight:700;color:var(--muted)}
.tabbar a svg,.tabbar a .gl{padding:2px 14px;border-radius:999px;box-sizing:content-box}
.tabbar a[aria-current="page"]{color:var(--ink)}
.tabbar a[aria-current="page"] svg,.tabbar a[aria-current="page"] .gl{background:var(--sun);color:#161b26}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar .gl{font:400 20px/22px var(--f-disp)}

/* phrase sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,16,30,.45)}
.panel{width:100%;max-width:560px;background:var(--surface);border-radius:24px 24px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto}
.panel .ko{font:700 28px/1.35 var(--f-ko);margin:0}
.panel .zh{font-size:18px;font-weight:500;margin:2px 0 6px}
.panel .rm{font-size:14px;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 4px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:10px 4px;font-size:13px;font-weight:500;cursor:pointer}
.act svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act[aria-pressed="true"]{border-color:var(--l6);color:var(--l6)}
.act[aria-pressed="true"] svg{fill:currentColor}
.spell{margin-top:12px;font-size:14px}
.spell summary{cursor:pointer;color:var(--muted)}
.spell .sy{margin-top:8px}
/* 位置配色：子音（初聲）藍、母音紅、收音（終聲）深色 */
:root{--ci:var(--l1);--vi:var(--l6);--fi:var(--ink)}
.mz{background-color:var(--surface);border:1.5px solid var(--line);border-radius:6px;
  background-image:linear-gradient(to right,transparent calc(50% - .5px),var(--soft) calc(50% - .5px),var(--soft) calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(to bottom,transparent calc(50% - .5px),var(--soft) calc(50% - .5px),var(--soft) calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(to top right,transparent calc(50% - .5px),var(--soft) calc(50% - .5px),var(--soft) calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(to bottom right,transparent calc(50% - .5px),var(--soft) calc(50% - .5px),var(--soft) calc(50% + .5px),transparent calc(50% + .5px))}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.legend span{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.legend .c{color:var(--ci);background:color-mix(in srgb,var(--ci) 12%,var(--surface))}
.legend .v{color:var(--vi);background:color-mix(in srgb,var(--vi) 12%,var(--surface))}
.legend .f{color:var(--fi);background:var(--soft)}
.syls{display:flex;gap:10px;overflow-x:auto;padding:4px 0}
.syl{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:58px}
.syl .mc{width:56px;aspect-ratio:1;display:grid;place-items:center;font:700 30px/1 var(--f-ko)}
.eq3{display:flex;gap:3px;font:700 15px/1.2 var(--f-ko)}
.eq3 .i{color:var(--ci)} .eq3 .v{color:var(--vi)} .eq3 .f{color:var(--fi)}
.syl .r{font-size:12px;color:var(--muted)}
.pnote{font-size:12px;color:var(--muted);margin:6px 0 0}
.pron{font-size:14px;color:var(--muted);margin-top:4px}
.pron b{color:var(--ink);font-family:var(--f-ko)}
.close{display:block;margin:14px auto 0;border:0;background:none;color:var(--muted);cursor:pointer;padding:6px 12px}

/* show-to-staff */
.show{position:fixed;inset:0;z-index:50;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;cursor:pointer}
.show .ko{font:700 clamp(40px,13vw,96px)/1.25 var(--f-ko);text-wrap:balance;word-break:keep-all}
.show .zh{font-size:18px;color:var(--muted)}
.show .x{font-size:13px;color:var(--muted)}

/* 認字入門 */
.steps{display:flex;gap:6px;overflow-x:auto;margin:0 0 16px;padding-bottom:2px;scrollbar-width:none}
.steps a{flex:0 0 auto;display:flex;align-items:center;gap:6px;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:500}
.steps a i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--soft)}
.steps a[aria-current="step"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.steps a[aria-current="step"] i{background:var(--sun);color:#161b26}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.pair .arr{color:var(--muted);font-size:18px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;line-height:1.25;cursor:pointer}
.cc:hover{border-color:var(--l1)}
.cc.x{border-style:dashed;background:var(--soft)}
.cc b{display:block;font:700 24px/1.15 var(--f-glyph)}
.cc span{display:block;font-size:12px;color:var(--muted)}
.cc small{display:block;font:500 11px/1.3 var(--f-ko);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl.syl th,.tbl.syl td{text-align:center;padding:5px 6px;font-family:var(--f-ko);white-space:nowrap}
.tbl.syl td{font-size:16px}
.tdj{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tdj div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.tdj b{display:block;font-size:18px}
.tdj span{font-size:12px;color:var(--muted)}
.vs{width:56px;height:56px;display:block;margin:0 auto}
.vs line{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.vs .hi{fill:var(--l6);stroke:var(--l6)}
.vcomp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.vc{display:grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto;align-items:center;justify-content:start;column-gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.vc .vs{width:44px;height:44px}
.vc b{font:700 28px/1 var(--f-glyph)}
.vc .arr{color:var(--muted)}
.vc .vt{grid-column:1 / -1;font-size:12px;color:var(--muted);margin-top:4px}
.art{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.art-h{margin-bottom:10px}
.art-h b{font-size:16px}
.art-h .o{font-size:12px;color:var(--muted);margin-left:6px}
.art-h p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.art-h .qt{color:var(--ink);font-weight:500;margin-right:6px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chain .fc{flex:1 1 76px;max-width:120px}
.chain .plus{font-size:11px;color:var(--muted);white-space:nowrap}
.chain.sub{margin-top:6px}
.chain.sub .fc{flex:0 1 96px}
.fam{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fh{font-size:12px;color:var(--muted);text-align:center}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;line-height:1.3;cursor:pointer}
.fc:hover{border-color:var(--l7)}
.fc b{display:block;font:700 30px/1.15 var(--f-glyph)}
.fc span{display:block;font-size:12px;color:var(--muted)}
.fc small{display:block;font:700 12px/1.3 var(--f-ko);margin-top:3px}
.fc.tense{cursor:default;background:var(--soft);border-style:dashed}
.fc.tense:hover{border-color:var(--line)}
.fc.none{cursor:default;background:none;border:1px dashed var(--line);color:var(--muted);display:grid;place-items:center}
.fin{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(96px,1fr);align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fin .fl b{display:block;font:700 17px/1.3 var(--f-glyph)}
.fin .fl span{font-size:13px;color:var(--muted)}
.fin .fx{font:700 16px/1 var(--f-ko);color:var(--muted);white-space:nowrap}
.fin .chip{padding:6px}
.picks{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 8px}
.picks span{font-size:13px;color:var(--muted);width:100%}
.picks button{min-width:38px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 6px;font:500 17px/1.2 var(--f-ko);cursor:pointer}
.picks button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.blk{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px}
.blk .big{font:700 60px/1 var(--f-glyph);min-width:76px;text-align:center}
.blk .eq{font-size:14px;color:var(--muted);line-height:1.7}
.blk .eq b{color:var(--ink)}
.sign-w{display:inline-block;margin:10px 0 6px;padding:8px 20px;border-radius:12px;background:var(--sign);color:#fff;font:700 32px/1.2 var(--f-glyph);box-shadow:inset 0 0 0 3px rgba(255,255,255,.85),inset 0 0 0 5px var(--sign)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.opt.ok{border-color:var(--heard);color:var(--heard);font-weight:700}
.opt.dim{opacity:.55}
.ref{margin-top:28px;font-size:14px}
.ref summary{cursor:pointer;color:var(--muted)}
.refg{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-top:8px}
.refg div{background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center;padding:4px 2px}
.refg b{display:block;font:700 18px/1.2 var(--f-glyph)}
.refg span{font-size:11px;color:var(--muted)}

.picks.v button[aria-checked="true"]{background:var(--vi);border-color:var(--vi);color:var(--on-c)}
.picks.t button[aria-checked="true"]{background:var(--fi);border-color:var(--fi);color:var(--bg)}
.stage{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:6px 0 4px}
.bcell{width:140px;aspect-ratio:1;display:grid;place-items:center;font:700 88px/1 var(--f-ko);cursor:pointer}
.frm{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.frm div{display:flex;align-items:center;gap:8px}
.frm b{min-width:34px;height:34px;display:grid;place-items:center;border-radius:8px;font:700 20px/1 var(--f-ko)}
.frm .i{color:var(--ci);background:color-mix(in srgb,var(--ci) 12%,var(--surface))}
.frm .v{color:var(--vi);background:color-mix(in srgb,var(--vi) 12%,var(--surface))}
.frm .f{color:var(--fi);background:var(--soft)}
.readout{margin:10px 0 2px;font-size:14px}
.readout b{font-size:20px}

.opt.bad{border-color:var(--l6);color:var(--l6)}

.score b{color:var(--ink)}

.state{display:inline-block;font-size:12px;font-weight:800;padding:1px 10px;border-radius:999px;margin-right:8px;background:var(--soft);color:var(--muted);vertical-align:2px}
.state.ok{background:color-mix(in srgb,var(--heard) 16%,var(--surface));color:var(--heard)}

.path{display:grid;gap:12px}

.pb b{font-size:17px;font-weight:800}
.pb p{margin:2px 0 10px;color:var(--muted);font-size:14px}
.pb .seg{margin:0}
.pb .tiles{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}

.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.qcard{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;transition:transform .12s,box-shadow .12s}
.qcard:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.qcard b{font-weight:800}
.qcard span{font-size:13px;color:var(--muted)}
.qprog{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}

#tc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}

.pager a{text-decoration:none;font-weight:500;color:var(--ink);padding:6px 4px}
.pager a[aria-disabled="true"]{visibility:hidden}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:2px}

#toast.show{opacity:1}

  /* 預錄音檔（MeloTTS 產生），找不到或播放失敗時改用瀏覽器語音 */
  function speak(text,slow){
    var id=(window.KO_AUDIO||{})[norm(text)];
    if(player){player.pause();player=null;}
    if('speechSynthesis' in window){try{window.speechSynthesis.cancel();}catch(e){}}
    if(id){
      var a=player=new Audio('audio/'+(slow?'s':'n')+'/'+id+'.mp3');
      a.play().catch(function(err){if(player===a&&err.name!=='AbortError')synth(text,slow);});
      return;
    }
    synth(text,slow);
  }
  function synth(text,slow){
    if(!('speechSynthesis' in window)){toast('這個瀏覽器不支援語音播放');return;}
    if(!voices.length)loadVoices();
    try{
      var u=new SpeechSynthesisUtterance(norm(text));
      u.lang='ko-KR';u.rate=slow?0.7:0.95;
      for(var i=0;i<voices.length;i++){if((voices[i].lang||'').toLowerCase().replace('_','-').indexOf('ko')===0){u.voice=voices[i];break;}}
      if(!u.voice&&voices.length&&!warned){warned=true;toast('找不到韓文語音，請到手機設定安裝韓文文字轉語音');}
      window.speechSynthesis.speak(u);
    }catch(e){toast('語音播放失敗');}
  }

  /* ---------- hangul spelling ---------- */
  var JL="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ".split(''),
      JV="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ".split(''),
      JT=[''].concat("ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ".split(''));
  function spell(word){
    var out=[],seen={};
    for(var i=0;i<word.length;i++){
      var c=word.charCodeAt(i)-0xAC00;
      if(c<0||c>11171||seen[word[i]])continue;
      seen[word[i]]=1;
      var parts=[JL[Math.floor(c/588)],JV[Math.floor(c%588/28)]];
      if(c%28)parts.push(JT[c%28]);
      out.push(word[i]+' = '+parts.join('+'));
    }
    return out;
  }

  /* 拼音（韓國文化觀光部標準） */
  var RI=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
  var RV=['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
  var RF=['','k','k','k','n','n','n','t','l','k','m','l','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
  /* 實際唸法（套用連音、鼻音化等規則），與拼寫相同時不顯示 */
  function pronOf(k){var r=(window.KO_PRON||{})[norm(k)];return r&&r!==norm(k)?r:'';}
  function sylParts(ch){var c=ch.charCodeAt(0)-0xAC00;return {i:Math.floor(c/588),v:Math.floor(c%588/28),f:c%28};}
  function sylRom(o){return RI[o.i]+RV[o.v]+RF[o.f];}
  /* 逐字拆成 初聲／中聲／終聲，用位置配色 */
  function spellCards(word){
    var out=[];
    for(var n=0;n<word.length;n++){
      var c=word.charCodeAt(n);if(c<0xAC00||c>0xD7A3)continue;
      var o=sylParts(word[n]);
      out.push('<div class="syl"><span class="mc mz" lang="ko">'+word[n]+'</span><span class="eq3"><span class="i">'+JL[o.i]+'</span><span class="v">'+JV[o.v]+'</span>'+(o.f?'<span class="f">'+JT[o.f]+'</span>':'')+'</span><span class="r">'+sylRom(o)+'</span></div>');
    }
    return '<div class="syls">'+out.join('')+'</div><p class="pnote">逐字拆開的拼音；連在一起唸時聲音會變，實際唸法見上方，規則在「認字入門 → 連讀」。</p>';
  }

  /* 依情境與練習方式組出提示詞，教材範圍直接列在裡面 */
  var AI_SC=SC.concat([{id:"all",n:"綜合"}]);

    var s=AI_SC.filter(function(x){return x.id===sc;})[0],lines=[],words=[];

      (b.chips||[]).forEach(function(a){words.push(a[0]+'（'+a[2]+'）');});

    });
    var head='請你當我的韓語口說練習夥伴，用語音和我對話。\n\n'+
      '關於我：台灣人，剛開始學韓文，準備去韓國旅遊。我只學過下面「教材範圍」裡的句子和單字。\n\n';
    var how=mode==='quiz'
      ?'練習方式：口說抽考\n'+
       '- 每次從教材範圍挑一句，用中文告訴我意思，請我用韓文說出來。一次只出一題，等我回答再繼續。\n'+
       '- 我說完後，用中文告訴我對不對；不對的話，用韓文慢慢示範正確說法，請我再說一次。\n'+
       '- 說錯的句子，過幾題後再考一次。\n'+
       '- 大約 10 題後結束，用中文總結我最需要加強的 3 句（附韓文）。\n'+
       '- 現在出第一題。\n\n'
      :'練習方式：角色扮演\n'+
       '- 你扮演'+AI_ROLE[sc]+'；我是觀光客。\n'+
       '- 你說韓文時要簡單、慢一點，一次只說一兩句，盡量使用教材範圍內的說法。\n'+
       '- 你每說完一段韓文，接著用中文簡短翻譯。\n'+
       '- 我說錯或不自然時，先用中文告訴我問題在哪，再用韓文慢慢示範正確說法，請我再說一次，然後繼續劇情。\n'+
       '- 我卡住或改說中文時，提示我可以用教材裡的哪一句。\n'+

       '- 由你先開始。\n\n';

  function renderAI(){

  /* ---------- 認字入門：母音 → 子音家族 → 拼字積木 → 解碼招牌 ---------- */
  var HSTEPS=['母音','子音','拼字','連讀'];
  function vowel(ch){return VOW.filter(function(a){return a[0]===ch;})[0];}

  function cv(a){

      '<span class="ex"><span class="exk">'+a[4]+'</span> '+a[5]+'</span></button>';
  }
  /* 子音依《訓民正音解例本》的發音部位分組：基本字模仿發音器官，每加一劃聲音更強，雙寫為緊音 */
  var ART=[
    {n:"舌根音",o:"牙音",base:"ㄱ",q:"象舌根閉喉之形",why:"舌根往上擋住喉嚨的樣子",chain:["ㄱ","ㅋ"],tense:["ㄲ"]},
    {n:"舌尖音",o:"舌音",base:"ㄴ",q:"象舌附上腭之形",why:"舌尖貼住上顎前方的樣子",chain:["ㄴ","ㄷ","ㅌ"],tense:["ㄸ"],alt:"ㄹ"},
    {n:"雙唇音",o:"脣音",base:"ㅁ",q:"象口形",why:"嘴巴的形狀",chain:["ㅁ","ㅂ","ㅍ"],tense:["ㅃ"]},
    {n:"齒音",o:"齒音",base:"ㅅ",q:"象齒形",why:"牙齒的形狀",chain:["ㅅ","ㅈ","ㅊ"],tense:["ㅆ","ㅉ"]},
    {n:"喉音",o:"喉音",base:"ㅇ",q:"象喉形",why:"喉嚨的形狀",chain:["ㅇ","ㅎ"],tense:[],plus:"加劃"}
  ];
  var TENSE={"ㄲ":"kk","ㄸ":"tt","ㅃ":"pp","ㅆ":"ss","ㅉ":"jj"};
  function famCell(ch,note){
    var a=cons(ch);
    return '<button class="fc" type="button" data-say="'+a[1]+', '+a[4]+'"><b>'+a[0]+'</b><span>'+(ch==='ㅇ'?'開頭不發音・尾音 ng':a[2]+' · '+a[3].replace(/（.*?）/,''))+'</span><small>'+(note||a[4]+' '+a[5])+'</small></button>';

  function artRow(g){

    var extra=g.tense.map(function(ch){var a=letter(ch);return '<button class="fc tense" type="button" data-say="'+a[1]+', '+a[4]+'"><b>'+ch+'</b><span>'+a[2]+'・緊音</span><small>'+a[4]+' '+a[5]+'</small></button>';}).join('')+
      (g.alt?famCell(g.alt,'變體・'+cons(g.alt)[4]):'');
    return '<section class="art"><div class="art-h"><b>'+g.n+'</b><span class="o">'+g.o+'</span>'+
      '<p><span class="qt">'+g.base+'「'+g.q+'」</span>'+g.why+'</p></div>'+
      '<div class="chain">'+cells+'</div>'+(extra?'<div class="chain sub">'+extra+'</div>':'')+'</section>';
  }
  /* 母音的天地人：· 天、ㅡ 地、ㅣ 人 */
  function vsvg(kind){
    var L=function(x1,y1,x2,y2){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>';},D=function(x,y){return '<circle class="hi" cx="'+x+'" cy="'+y+'" r="5"/>';};
    var parts={dot:D(30,30),earth:L(8,30,52,30),man:L(30,8,30,52),
      "ㅏ":L(24,8,24,52)+D(42,30),"ㅓ":D(18,30)+L(36,8,36,52),"ㅗ":D(30,18)+L(8,40,52,40),"ㅜ":L(8,20,52,20)+D(30,40)}[kind];
    return '<svg class="vs" viewBox="0 0 60 60" aria-hidden="true">'+parts+'</svg>';
  }
  function hangulRef(){
    return '<a class="wide-link" href="#/tools/chart" style="margin-top:28px;--c:var(--l1)"><span class="g" aria-hidden="true">40</span><span><b>40 音表</b><span>19 個子音、21 個母音一次看</span></span></a>';
  }
  /* 40 音表：子音 19（基本 14＋緊音 5）、母音 21（基本 10＋複合 11），依字典順序 */
  var ORD_C="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ".split(''),ORD_V="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ".split('');
  V.chart=function(){
    var isExtra=function(ch){return TENSEC.concat(COMPV).some(function(a){return a[0]===ch;});};
    var cell=function(ch){var a=letter(ch);
      return '<button class="cc '+(ch>='ㅏ'?'v':'c')+(isExtra(ch)?' x':'')+'" type="button" data-say="'+a[1]+', '+a[4]+'"><b>'+ch+'</b><span>'+(ch==='ㅇ'?'ng':a[2].replace(/（.*?）|\s/g,''))+'</span><small>'+a[4]+'</small></button>';};
    var bc=CON.map(function(a){return a[0];}).filter(function(c){return c!=='ㅇ';}).concat(['ㅇ']);
    var bv=VOW.map(function(a){return a[0];});
    var grid='<div class="scroll"><table class="tbl syl"><tr><th></th>'+bv.map(function(v){return '<th>'+v+'</th>';}).join('')+'</tr>'+
      CON.map(function(c){var li="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ".indexOf(c[0]);
        return '<tr><th>'+c[0]+'</th>'+bv.map(function(v){var vi="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ".indexOf(v);
          return '<td lang="ko">'+String.fromCharCode(0xAC00+li*588+vi*28)+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
    return {t:'40 音表',back:'#/',html:
      '<p class="lead">韓文常說的「40 音」：子音 19 個、母音 21 個。虛線框是緊音和複合母音，點任何一格會唸出音節和例字。</p>'+
      '<div class="legend"><span class="c">子音（初聲）</span><span class="v">母音</span><span class="f">收音（最下方）</span></div>'+
      '<h2>子音 19 個</h2><div class="cgrid">'+ORD_C.map(cell).join('')+'</div>'+
      '<h2>母音 21 個</h2><div class="cgrid">'+ORD_V.map(cell).join('')+'</div>'+
      '<h2>拼音表：子音 × 母音</h2><p class="lead">每一格是左邊的子音配上面的母音。先試著唸，再到「認字入門」的拼字積木確認。</p>'+grid+
      '<a class="wide-link" href="#/tools/hangul" style="margin-top:20px"><span class="g" aria-hidden="true">한</span><span><b>認字入門</b><span>用《訓民正音》的設計原理一步步學</span></span></a>'};
  };
  V.hangul=function(step){
    step=Math.min(Math.max(parseInt(step,10)||1,1),4);
    var nav='<nav class="steps" aria-label="認字入門步驟">'+HSTEPS.map(function(n,i){
      return '<a href="#/tools/hangul/'+(i+1)+'"'+(i+1===step?' aria-current="step"':'')+'><i>'+(i+1)+'</i>'+n+'</a>';}).join('')+'</nav>';
    var body;
    if(step===1){
      var pair=function(a,b){var x=vowel(a),y=vowel(b);
        return '<div class="pair">'+hc(x)+'<span class="arr" aria-hidden="true">→</span>'+hc(y)+'</div>';};
      var comp=function(v,t){return '<div class="vc">'+vsvg(v)+'<span class="arr" aria-hidden="true">→</span><b lang="ko">'+v+'</b><span class="vt">'+t+'</span></div>';};
      body='<p class="lead">母音由三個元素組成，這是《訓民正音》（1446）創字時的設計：</p>'+
        '<div class="tdj"><div>'+vsvg('dot')+'<b>天</b><span>圓點・「形之圓，象乎天也」</span></div><div>'+vsvg('earth')+'<b>地</b><span>ㅡ・「形之平，象乎地也」</span></div><div>'+vsvg('man')+'<b>人</b><span>ㅣ・「形之立，象乎人也」</span></div></div>'+
        '<p class="lead" style="margin-top:12px">把「天」的點放在「人」或「地」旁邊，就組成母音。點後來寫成了短橫，就是現在的樣子：</p>'+
        '<div class="vcomp">'+comp('ㅏ','點在人的右邊，a')+comp('ㅓ','點在人的左邊，eo')+comp('ㅗ','點在地的上面，o')+comp('ㅜ','點在地的下面，u')+'</div>'+
        '<p class="note" style="margin-top:10px">點在外側或上方（ㅏ ㅗ）聲音明亮，在內側或下方（ㅓ ㅜ）比較低沉，這是設計時的陰陽概念。</p>'+
        '<h2>6 個基本母音</h2>'+
        '<div class="hgrid">'+["ㅏ","ㅓ","ㅗ","ㅜ","ㅡ","ㅣ"].map(function(c){return hc(vowel(c));}).join('')+'</div>'+
        '<p class="note" style="margin-top:10px">短橫在右 ㅏ 是 a、在左 ㅓ 是 eo；在上 ㅗ 是 o、在下 ㅜ 是 u。沒有短橫的 ㅡ、ㅣ 分別是 eu、i。</p>'+
        '<h2>兩個點，就是加 y</h2><p class="lead">天的點變成兩個（現在寫成兩條短橫），前面就多一個 y 的音，這 4 個不用另外背。</p>'+
        '<div class="pairs">'+pair("ㅏ","ㅑ")+pair("ㅓ","ㅕ")+pair("ㅗ","ㅛ")+pair("ㅜ","ㅠ")+'</div>'+
        '<h2>再合起來：複合母音</h2><p class="lead">兩個母音合在一起，就是複合母音，一共 11 個。規則只有兩條。</p>'+
        '<h3>1. 後面加 ㅣ</h3><p class="lead" style="font-size:14px">《訓民正音》：「一字中聲之與ㅣ相合者十」，現代還在用的是這 7 個。</p>'+
        '<div class="hgrid">'+["ㅐ","ㅒ","ㅔ","ㅖ","ㅚ","ㅟ","ㅢ"].map(function(c){return cv(letter(c));}).join('')+'</div>'+
        '<h3>2. 明亮配明亮、低沉配低沉</h3><p class="lead" style="font-size:14px">《訓民正音》：「ㅗ與ㅏ同出於ㆍ，故合而為ㅘ」。所以 ㅗ 只和 ㅏ、ㅐ 合，ㅜ 只和 ㅓ、ㅔ 合。</p>'+
        '<div class="hgrid">'+["ㅘ","ㅙ","ㅝ","ㅞ"].map(function(c){return cv(letter(c));}).join('')+'</div>'+
        '<p class="note" style="margin-top:10px">現代首爾話裡，ㅐ 和 ㅔ 都唸 e，ㅙ、ㅚ、ㅞ 都唸 we，分不清也沒關係。像「주세요」的 세 就是 ㅅ+ㅔ。另外 ㅢ 有三種唸法：在字首唸 ui（의사），在字中唸 i（편의점 唸 [펴니점]），當「的」時唸 e。</p>'+
        '<h2>寫寫看</h2><p class="lead">照著淡淡的範本描，熟了就按「隱藏範本」自己寫。</p><div id="tracer" data-set="v"></div>';
    }else if(step===2){
      body='<p class="lead">14 個子音其實只有 5 個基本字，都是照著<b>發音時口腔的樣子</b>畫出來的。同一組的字發音部位相同，每<b>加一劃</b>聲音就更強；<b>寫兩次</b>是緊音。</p>'+
        '<div class="stack">'+ART.map(artRow).join('')+'</div>'+
        '<p class="note" style="margin-top:10px">「」裡是《訓民正音解例本》（1446）的原文。給台灣人的對照：緊音 ㄲㄸㅃㅉ 很像國語不送氣的 ㄍㄉㄅㄐ，再加一點喉嚨用力；平音 ㄱㄷㅂㅈ 在字首反而帶一點氣，介於 ㄍ 和 ㄎ 之間，音調也比較低。緊音一定要分清楚，例如 싸요（便宜）和 사요（買）、짜요（鹹）和 자요（睡覺）意思完全不同。ㅇ 放在開頭不發音，只是佔位；放在最後是 ng，像「공항」。點卡片會唸出音節和例字。</p>'+
        '<h2>寫寫看</h2><p class="lead">照著淡淡的範本描，熟了就按「隱藏範本」自己寫。</p><div id="tracer" data-set="c"></div>';
    }else if(step===3){
      body='<p class="lead">韓文像拼積木：子音＋母音，有時再加一個尾音，組成一個方塊字。選選看：</p><div id="builder"></div>'+
        '<h2>把這個字寫寫看</h2><p class="lead">注意子音、母音、尾音各佔方塊的哪一塊。</p><div id="tracer" data-set="b"></div>'+
        '<h2>尾音只有 7 種唸法</h2><p class="lead">尾音不會單獨發音，一定黏在前面的音後面。k、t、p 收尾時嘴巴做好動作，但不把氣放出來。</p>'+
        '<div class="stack">'+FINALS.map(function(f){
          return '<div class="fin"><div class="fl"><b>'+f[0]+'</b><span>收 '+f[1]+'</span></div><div class="fx" lang="ko">아 → '+String.fromCharCode(0xC544+f[2])+'</div>'+
            '<button class="chip" type="button" data-say="'+f[3]+'"><span class="ko">'+f[3]+'</span><span class="zh">'+f[4]+'</span></button></div>';
        }).join('')+'</div>'+
        '<p class="note" style="margin-top:10px"><b>台灣人的優勢：</b>如果你會閩南語或客語，k、t、p 收尾的音你本來就會（像「六」「食」「十」），n、m、ng 收尾則跟華語的 -n、-ng 很像。</p>';

  /* 今日練習：先排到期的複習，再補新內容；不同素材交錯 */
  function dueItems(){
    var now=Date.now(),all=items();
    return Object.keys(state.srs).filter(function(id){return all[id]&&state.srs[id].d<=now;})
      .sort(function(a,b){return state.srs[a].d-state.srs[b].d;}).map(function(id){return all[id];});
  }
  function newItems(){
    var all=items(),fresh=function(it){return !state.srs[it.id];};
    var heard=Object.keys(state.h).map(function(k){return all['P:'+k]||all['W:'+k];}).filter(function(x){return x&&fresh(x);});
    var pri=PRIORITY.map(function(k){return all['P:'+k];}).filter(function(x){return x&&fresh(x);});
    var letters=ORD_C.concat(ORD_V).map(function(ch){return all['L:'+ch];}).filter(fresh);
    var words=shuffle(itemsOf(['word']).filter(fresh)),prices=shuffle(itemsOf(['price']).filter(fresh));
    var phrases=[],seen={};heard.concat(pri).forEach(function(x){if(!seen[x.id]){seen[x.id]=1;phrases.push(x);}});
    var lanes=[letters,phrases,words,letters,phrases,prices],out=[];
    for(var r=0;r<6;r++)lanes.forEach(function(l){if(l.length)out.push(l.shift());});
    return out;
  }
  function buildDaily(){
    var due=dueItems().slice(0,10),fresh=newItems(),list=due.slice();
    fresh.forEach(function(x){if(list.length<10&&list.indexOf(x)<0)list.push(x);});
    list=shuffle(list);
    var last=null;
    return list.map(function(it){
      var ts=typesFor(it).filter(function(t){return t!==last;});if(!ts.length)ts=typesFor(it);
      last=ts[rnd(ts.length)];return {type:last,id:it.id};
    });
  }
  function pickForType(type){
    var T=QTYPES[type];if(type==='syl')return null;
    var pool=itemsOf(T.kinds,T.filter),now=Date.now();
    var due=pool.filter(function(it){return state.srs[it.id]&&state.srs[it.id].d<=now;});
    if(due.length&&Math.random()<.6)return due[rnd(due.length)];
    var bag=[];pool.forEach(function(it){var r=state.srs[it.id],w=r?Math.max(1,4-r.b):3;for(var i=0;i<w;i++)bag.push(it);});
    return bag[rnd(bag.length)];
  }

  function audioUrls(){

  function cachedAudio(){

  function downloadAudio(){
    if(dl.busy||!window.caches)return;

      var set={};have.forEach(function(u){set[u]=1;});

      dl={busy:true,done:all.length-todo.length,total:all.length,fail:0};renderOffline();
      return caches.open(AUDIO_CACHE).then(function(c){
        var i=0;
        var worker=function(){
          if(i>=todo.length)return Promise.resolve();
          var u=todo[i++];
          return c.add(u).then(function(){dl.done++;},function(){dl.fail++;}).then(function(){renderOffline();return worker();});
        };
        return Promise.all([worker(),worker(),worker(),worker()]);
      });
    }).then(function(){dl.busy=false;renderOffline();toast(dl.fail?'有 '+dl.fail+' 個音檔沒下載成功，可以再按一次':'音檔都下載好了，沒網路也能聽');});

      if(!$('offline'))return;
      box.innerHTML=
        '<section class="art"><div class="art-h"><span class="state'+(ready?' ok':'')+'">'+(ready?'已完成':'準備中')+'</span><b>'+(ready?'頁面可以離線開啟':'正在準備離線版')+'</b><p>'+(ready?'打開過一次之後，沒有網路也能開啟教材、看句子和字母。':'第一次開啟時會在背景準備，重新整理一次就完成。')+'</p></div></section>'+
        '<section class="art" style="margin-top:10px"><div class="art-h"><b>發音音檔　'+n+' / '+total+'</b><p>約 5 MB。沒下載的音檔，會在你第一次播放時自動存起來。</p></div>'+
          '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+
          '<div class="row-btns" style="margin-top:10px"><button class="btn pri" type="button" id="dlaudio"'+(dl.busy?' disabled':'')+'>'+(dl.busy?'下載中…':n>=total?'重新檢查':'下載全部音檔')+'</button></div></section>'+
        '<h2>加到手機主畫面</h2>'+
        (installEvt?'<div class="row-btns" style="margin-bottom:10px"><button class="btn pri" type="button" id="install">安裝到手機</button></div>':'')+
        '<ul class="plain"><li><b>iPhone</b>：用 Safari 開啟 → 點下方的分享按鈕 → 選「加入主畫面」。</li>'+
        '<li><b>Android</b>：用 Chrome 開啟 → 右上角選單 → 選「安裝應用程式」或「加到主畫面」。</li></ul>'+
        '<p class="note">離線時無法使用：YouGlish 真人片段，以及和 AI 對話。拼字積木裡沒有預錄音檔的字，會用手機內建語音。</p>';
    });
  }
  V.offline=function(){return {t:'離線使用',back:'#/more',html:'<p class="lead">出國時網路不一定穩，建議出發前在 Wi-Fi 下把音檔下載好。</p><div id="offline"></div>'};};
  V.numbers=function(){
    return {t:'數字與價錢',back:'#/',html:
      '<p class="note"><b>漢字數字</b>用在價錢、樓層、號碼、日期。<b>固有數字</b>用在數量、人數、幾點。</p>'+
      '<h2>漢字數字（價錢用）</h2>'+chips(SINO)+
      '<h2>聽懂價錢</h2><p class="note">一萬直接說 <b>만</b>，不說 일만；一百、一千也一樣，直接說 <b>백</b>、<b>천</b>。所以 12,000 是 만 이천，50,000 是 오만。</p>'+rows(PRICES)+
      '<h2>固有數字（數東西用）</h2>'+chips(NATIVE)+
      '<p class="note" style="margin-top:10px">後面接量詞時，하나 → <b>한</b>、둘 → <b>두</b>、셋 → <b>세</b>、넷 → <b>네</b>。常用量詞：개（個）、명（人）、잔（杯）、병（瓶）。例外：<b>인분</b>（人份）要配漢字數字，兩人份是 이 인분。</p>'+rows(COUNTERS)};
  };
  V.prep=function(){
    return {t:'出發前準備',back:'#/more',html:
      '<p class="lead">以下是一般性資訊，出發前請再到官方管道確認。</p>'+
      PRE.map(function(t,i){return '<label class="chk"><input type="checkbox" id="pre'+i+'" data-pre="p'+i+'"'+(state.p['p'+i]?' checked':'')+'><span>'+t+'</span></label>';}).join('')+
      '<h2>小小文化提醒</h2><ul class="plain">'+
        '<li>韓國一般沒有給小費的習慣。</li><li>遞東西或接東西時用雙手，比較有禮貌。</li>'+
        '<li>很多餐廳桌上有呼叫鈴，沒有的話就舉手喊 저기요 或 여기요。</li><li>很多餐廳是吃完到櫃台結帳，不是在座位上付錢。</li><li>部分烤肉店是 2 人份起點，一個人吃前先問一下。</li></ul>'};
  };
  /* ---------- shadowing ---------- */
  function ygLink(q){return 'https://youglish.com/pronounce/'+encodeURIComponent(q)+'/korean';}

  function shadowLists(){
    var L={fav:{n:'收藏的句子',keys:Object.keys(state.s).filter(function(k){return state.s[k]&&PH[k];})},
           common:{n:'常用句',keys:PRIORITY.slice()}};
    SC.forEach(function(s){L[s.id]={n:s.n,keys:s.keys};});
    return L;
  }
  var sh={list:null,key:null};
  V.shadow=function(listId,key){
    var L=shadowLists(),list=L[listId];
    if(!PH[key])return V.practice();
    if(!list||list.keys.indexOf(key)<0)list={n:'跟讀',keys:[key]};
    var i=list.keys.indexOf(key),p=PH[key];
    sh.list=listId;sh.key=key;
    var link=function(j){return j<0||j>=list.keys.length?'<a aria-disabled="true">.</a>'
      :'<a href="#/shadow/'+listId+'/'+encodeURIComponent(list.keys[j])+'">'+(j<i?'‹ 上一句':'下一句 ›')+'</a>';};
    return {t:'跟讀｜'+list.n,back:'#/practice',html:
      '<p class="sh-ko">'+esc(p.ko)+'</p><p class="sh-zh">'+esc(p.zh)+'</p><div class="sh-rm">'+esc(p.rm)+(p.zy?'　≈ '+esc(p.zy):'')+'</div>'+
      (pronOf(key)?'<div class="pron">實際唸法 <b lang="ko">['+esc(pronOf(key))+']</b></div>':'')+
      '<section class="step"><h3>聽完跟著大聲說</h3><div class="row-btns">'+
        '<button class="btn" type="button" data-sh="tts">播放</button><button class="btn" type="button" data-sh="tts-slow">慢速</button></div>'+
      '</section>'+
      '<section class="step"><h3>看韓國人怎麼說</h3>'+
        '<p class="lead" style="font-size:14px;margin-bottom:10px">從 YouTube 影片裡找出說這句話的片段，有字幕，可以放慢、重播、換下一段。</p>'+
        '<div id="ygw" class="yg"></div><p class="lead" id="ygmsg" style="font-size:14px;margin:8px 0 0" hidden></p>'+
        '<div class="row-btns" style="margin-top:10px">'+
          '<button class="btn pri" type="button" data-sh="yg" id="ygbtn">看真人片段</button>'+
          '<a class="btn" href="'+ygLink(key)+'" target="_blank" rel="noopener">在 YouGlish 開啟</a></div>'+
      '</section>'+
      '<div class="pager">'+link(i-1)+'<span>'+(i+1)+' / '+list.keys.length+'</span>'+link(i+1)+'</div>'};
  };

  /* YouGlish 官方嵌入元件：按下才載入與搜尋（免費版每天有搜尋次數上限），失敗時改用外連 */
  var ygReady=null,ygTimer=null,ygSeq=0;
  function loadYG(){
    if(ygReady)return ygReady;
    ygReady=new Promise(function(res,rej){
      if(window.YG&&window.YG.Widget)return res();
      window.onYouglishAPIReady=res;
      var s=document.createElement('script');s.src='https://youglish.com/public/emb/widget.js';s.onerror=rej;document.head.appendChild(s);
    });
    ygReady.catch(function(){ygReady=null;});
    return ygReady;
  }
  function ygMsg(t){var m=$('ygmsg');if(m){m.textContent=t;m.hidden=!t;}}
  function showYG(){
    var box=$('ygw'),seq=++ygSeq;
    if(!box)return;
    $('ygbtn').hidden=true;
    ygMsg('載入中…');
    clearTimeout(ygTimer);
    ygTimer=setTimeout(function(){if(seq===ygSeq)ygMsg('一直載不出來的話，可能是今天的免費搜尋次數用完了，請改按「在 YouGlish 開啟」。');},12000);
    loadYG().then(function(){
      if(seq!==ygSeq||!$('ygw'))return;
      var w=new YG.Widget('ygw',{width:Math.min(box.clientWidth,640),components:8+16+64,restrictionMode:1,autoStart:1,
        events:{
          onFetchDone:function(e){
            if(seq!==ygSeq)return;
            clearTimeout(ygTimer);
            ygMsg(+e.totalResult?'':'YouGlish 目前沒有這句的真人片段，先跟著語音練習就好。');
          },
          onError:function(){if(seq===ygSeq){clearTimeout(ygTimer);ygMsg('片段載入失敗，請改按「在 YouGlish 開啟」。');}}
        }});
      w.fetch(sh.key,'korean');
    }).catch(function(){if(seq===ygSeq){clearTimeout(ygTimer);ygMsg('無法連到 YouGlish，可能目前沒有網路。');}});
  }
  function stopYG(){ygSeq++;clearTimeout(ygTimer);}

  function stopAudio(){if(player){player.pause();}}

  /* ---------- router ---------- */
  var ROUTES={'':'home','practice':'practice','practice/ai':'ai','use':'use','list':'use','more':'more','tools':'more',
    'tools/numbers':'numbers','tools/chart':'chart','tools/patterns':'patterns','tools/offline':'offline','tools/prep':'prep'};
  var TABOF={home:'learn',numbers:'learn',chart:'learn',patterns:'learn',practice:'practice',ai:'practice',use:'use',more:'more',offline:'more',prep:'more'};
  function render(){
    var path=location.hash.replace(/^#\/?/,''),v,tab;
    stopYG();clearTimeout(qTimer);QZ=null;
    if(path.indexOf('tools/hangul')===0){v=V.hangul(path.split('/')[2]);tab='learn';}
    else if(path.indexOf('quiz/')===0){v=V.quiz(path.slice(5));tab='practice';}
    else if(path.indexOf('shadow/')===0){var ps=path.split('/');v=V.shadow(ps[1],decodeURIComponent(ps.slice(2).join('/')));tab='practice';}
    else if(path.indexOf('scene/')===0){v=V.scene(path.slice(6));tab='learn';}
    else{var n=ROUTES[path]||'home';v=V[n]();tab=TABOF[n]||'learn';}
    $('view').innerHTML=v.html;
    $('ttl').textContent=v.t;
    document.title=v.t==='旅遊韓語'?'韓國旅遊速成教材':v.t+'｜韓國旅遊速成教材';
    $('back').hidden=!v.back;$('logo').hidden=!!v.back;$('back').dataset.to=v.back||'';
    [].forEach.call(document.querySelectorAll('.tabbar a'),function(a){
      if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
    });
    initTracer();
    renderBuilder();
    if($('qz'))startQuiz($('qz').getAttribute('data-mode'));
    renderOffline();
    renderAI();
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',render);

  /* ---------- search ---------- */
  function search(q){
    var box=$('results'),body=$('usebody');
    q=q.trim().toLowerCase().replace(/\s+/g,'');
    if(!q){box.innerHTML='';body.hidden=false;return;}
    var hit=Object.keys(PH).filter(function(k){
      var p=PH[k];return (p.ko+p.zh+p.rm).toLowerCase().replace(/\s+/g,'').indexOf(q)>=0;
    }).slice(0,30);
    body.hidden=true;
    box.innerHTML=hit.length?'<h2>找到 '+hit.length+' 句</h2><div class="stack">'+hit.map(row).join('')+'</div>'
      :'<p class="lead" style="margin-top:14px">找不到符合的句子。試試中文關鍵字，例如「廁所」「刷卡」。</p>';
  }

  /* ---------- phrase sheet ---------- */
  var cur=null,lastFocus=null;
  function markHeard(k){
    state.h[k]=(state.h[k]||0)+1;save();
    [].forEach.call(document.querySelectorAll('[data-open="'+k+'"] .dt'),function(d){d.classList.add('on');});
  }
  function openSheet(k){
    var p=PH[k];if(!p)return;
    cur=k;lastFocus=document.activeElement;
    $('sk').textContent=p.ko;$('sz').textContent=p.zh;
    $('sr').textContent=p.rm+(p.zy?'　≈ '+p.zy:'');
    $('sy').innerHTML=spellCards(p.ko);
    var pr=pronOf(k);$('spr').hidden=!pr;$('spr').innerHTML=pr?'實際唸法 <b lang="ko">['+esc(pr)+']</b>':'';
    $('spell').open=false;
    document.querySelector('[data-act="star"]').setAttribute('aria-pressed',String(!!state.s[k]));
    $('sheet').hidden=false;document.body.classList.add('lock');
    $('panel').focus();
    speak(p.ko,state.slow);markHeard(k);
  }
  function closeSheet(){
    $('sheet').hidden=true;document.body.classList.remove('lock');
    if(lastFocus&&document.contains(lastFocus))lastFocus.focus();
    if(/^(use|list)$/.test(location.hash.replace(/^#\/?/,'')))render();
  }
  var wake=null;
  function showBig(){
    var p=PH[cur];
    $('showk').textContent=p.ko;$('showz').textContent=p.zh;
    $('show').hidden=false;$('show').focus();
    try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(function(w){wake=w;}).catch(function(){});}catch(e){}
  }
  function hideBig(){
    $('show').hidden=true;$('panel').focus();
    try{wake&&wake.release();}catch(e){}wake=null;
  }

  /* ---------- events ---------- */
  function syncSpeed(){var b=$('speed');b.textContent='語速：'+(state.slow?'慢':'正常');b.setAttribute('aria-pressed',String(state.slow));}
  syncSpeed();
  document.addEventListener('input',function(e){if(e.target.id==='q')search(e.target.value);});
  document.addEventListener('change',function(e){
    var k=e.target.getAttribute&&e.target.getAttribute('data-pre');
    if(k){state.p[k]=e.target.checked;save();}
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(!$('show').hidden)hideBig();else if(!$('sheet').hidden)closeSheet();
  });
  document.addEventListener('click',function(e){
    if(e.target.closest('#show')){hideBig();return;}
    if(e.target.id==='sheet'){closeSheet();return;}
    var t=e.target.closest('[data-open],[data-say],[data-act],[data-copy],[data-qa],[data-qn],[data-qr],[data-qs],[data-qplay],[data-qagain],[data-ai-sc],[data-ai-m],[data-sh],[data-hb],[data-tr],[data-trx],[data-view],#speed,#back,#seed,#dlaudio,#install');
    if(!t)return;
    if(t.id==='dlaudio'){downloadAudio();return;}
    if(t.id==='install'&&installEvt){installEvt.prompt();installEvt=null;renderOffline();return;}
    if(t.id==='speed'){state.slow=!state.slow;save();syncSpeed();return;}
    if(t.id==='back'){location.hash=t.dataset.to;return;}
    if(t.id==='seed'){TRIO.forEach(function(a){state.s[norm(a[0])]=1;});save();render();return;}
    if(t.hasAttribute('data-open')){openSheet(t.getAttribute('data-open'));return;}
    if(t.hasAttribute('data-say')){speak(t.getAttribute('data-say'),state.slow);return;}
    if(t.hasAttribute('data-qa')){answerQ(+t.getAttribute('data-qa'));return;}
    if(t.hasAttribute('data-qn')){advance();return;}
    if(t.hasAttribute('data-qplay')){if(QZ)speak(QZ.q.say,state.slow);return;}
    if(t.hasAttribute('data-qr')){if(QZ&&!QZ.answered){QZ.answered=true;renderQ();speak(QZ.q.say,state.slow);var fq=document.querySelector('[data-qs="1"]');if(fq)fq.focus();}return;}
    if(t.hasAttribute('data-qs')){if(QZ&&QZ.answered){settle(t.getAttribute('data-qs')==='1');if(QZ.q.item&&PH[QZ.q.item.k])markHeard(QZ.q.item.k);advance();}return;}
    if(t.hasAttribute('data-qagain')){if(QZ)startQuiz(QZ.mode);return;}
    if(t.hasAttribute('data-act')){
      var act=t.getAttribute('data-act');
      if(act==='play')speak(PH[cur].ko,false);
      else if(act==='slow')speak(PH[cur].ko,true);
      else if(act==='star'){if(state.s[cur])delete state.s[cur];else state.s[cur]=1;save();t.setAttribute('aria-pressed',String(!!state.s[cur]));toast(state.s[cur]?'已加入清單':'已從清單移除');}
      else if(act==='show')showBig();
      else if(act==='shadow'){var k=cur,ls=PH[k].sc||(PRIORITY.indexOf(k)>=0?'common':'one');closeSheet();location.hash='#/shadow/'+ls+'/'+encodeURIComponent(k);}
      else if(act==='close')closeSheet();
      return;
    }
    if(t.hasAttribute('data-view')){
      var vk=t.getAttribute('data-view');state.view[vk]=!state.view[vk];save();
      t.setAttribute('aria-pressed',String(state.view[vk]));
      var sw=document.querySelector('.scene');if(sw)sw.classList.toggle('no-'+vk,!state.view[vk]);return;
    }
    if(t.hasAttribute('data-tr')){tr.g=t.getAttribute('data-tr');renderTracer();var ft=document.querySelector('[data-tr="'+tr.g+'"]');if(ft)ft.focus();return;}
    if(t.hasAttribute('data-trx')){
      if(t.getAttribute('data-trx')==='clear'){tr.strokes=[];drawStrokes();}
      else{tr.guide=!tr.guide;t.setAttribute('aria-pressed',String(!tr.guide));$('tgc').hidden=!tr.guide;}
      return;
    }
    if(t.hasAttribute('data-hb')){
      var hp=t.getAttribute('data-hb').split(':');hb[hp[0]]=+hp[1];renderBuilder();
      var fb=document.querySelector('[data-hb="'+hp[0]+':'+hp[1]+'"]');if(fb)fb.focus();return;
    }
    if(t.hasAttribute('data-sh')){
      var s=t.getAttribute('data-sh');
      if(s==='tts')speak(PH[sh.key].ko,false);
      else if(s==='tts-slow')speak(PH[sh.key].ko,true);
      else if(s==='yg'){stopAudio();showYG();}
      return;
    }
    if(t.hasAttribute('data-ai-sc')){state.ai.sc=t.getAttribute('data-ai-sc');save();renderAI();document.querySelector('[data-ai-sc="'+state.ai.sc+'"]').focus();return;}
    if(t.hasAttribute('data-ai-m')){state.ai.m=t.getAttribute('data-ai-m');save();renderAI();document.querySelector('[data-ai-m="'+state.ai.m+'"]').focus();return;}
    if(t.hasAttribute('data-copy')){
      var txt=$('aip').value;
      var fallback=function(){
        var ok=false;
        try{$('aip').select();ok=document.execCommand('copy');}catch(err){ok=false;}
        toast(ok?'已複製':'請長按上面的文字手動複製');
      };
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast('已複製');},fallback);
      else fallback();
    }
  });

  render();
  if('serviceWorker' in navigator){navigator.serviceWorker.addEventListener('controllerchange',renderOffline);}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(function(){
    navigator.serviceWorker.ready.then(renderOffline);
  }).catch(function(){});
})();
</script>
</body>
</html>
